<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENEMBreak — Cadastre-se</title>
    <link rel="shortcut icon" href="img/png-transparent-digital-marketing-business-distance-education-school-study-text-service-people-remove-bg-io.png" type="image/x-icon">
    <link rel="stylesheet" href="css/styleCadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="cabeçalho-cadastro">
        <div class="container-cabeçalho">
            <a href="index.html"><div class="logo">
                <span class="logo-icon">📖</span> <span class="logo-text">ENEM<span>Break</span></span>
            </div></a>
        </div>
    </header>
    <main class="principal">
        <form class="container-form">
            <h1>Cadastre-se</h1>
            <label for="text">Nome: </label>
            <input class="inputs-form" type="text" placeholder="Digite seu nome">
            <label for="password">Email: </label>
            <input class="inputs-form" type="email" placeholder="Digite seu email">
            <label for="text">Senha: </label>
            <input class="inputs-form" type="password" placeholder="Digite sua senha">
            <label for="password">Confirme a senha: </label>
            <input class="inputs-form" type="password" placeholder="Confirme a senha">
            <button>Confirmar</button>
            <p>Já tem uma conta?</p>
            <a href="Login.html">Fazer login</a>
        </form>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
